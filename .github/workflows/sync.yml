name: Sync marketplace and README

# After anything under plugins/ changes on main, regenerate .claude-plugin/marketplace.json
# and the README plugin table, and open a PR with the result. Adding a skill = adding its folder.
#
# NOTE: if you protect `main` so that every change needs a pull request, this workflow
# must create a branch and PR instead of pushing directly to `main`.

on:
  push:
    branches: [main]
    paths:
      - "plugins/**"
      - "scripts/sync_repo.py"
      - "scripts/validate_all_plugins.py"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Regenerate marketplace.json and README table
        run: python3 scripts/sync_repo.py

      - name: Commit changes and open PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet; then
            echo "Already in sync."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          BRANCH="chore/sync-marketplace-$(date -u +%Y%m%d-%H%M%S)"
          git checkout -b "$BRANCH"

          git add README.md .claude-plugin/marketplace.json claude-project/knowledge
          git commit -m "chore: sync marketplace and README plugin table [skip ci]"
          git push origin "$BRANCH"

          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "chore: sync marketplace and README plugin table" \
            --body "Automated sync of the marketplace JSON and README plugin table generated by the repository sync workflow."
