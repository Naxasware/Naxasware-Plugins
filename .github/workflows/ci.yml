name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate plugins and skills
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: JSON syntax of every manifest
        run: |
          set -euo pipefail
          fail=0
          while IFS= read -r -d '' f; do
            python3 -c "import json,sys; json.load(open(sys.argv[1]))" "$f" && echo "ok  $f" || { echo "BAD $f"; fail=1; }
          done < <(find . -path ./.git -prune -o \( -name plugin.json -o -name marketplace.json \) -type f -print0)
          exit $fail

      - name: Validate every plugin and skill
        run: python3 scripts/validate_all_plugins.py .

      - name: Marketplace and README are in sync
        # Informational on PRs: the Sync workflow fixes this automatically after merge.
        run: python3 scripts/sync_repo.py --check || echo "::notice::marketplace.json / README table will be regenerated after merge (or run scripts/sync_repo.py)"

      - name: Scaffolder still works (regression test)
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          cp -R . "$tmp/repo"
          cd "$tmp/repo"
          python3 scripts/new_plugin.py ci-scaffold-check --description "CI scaffold regression check for the plugin template."
          python3 scripts/validate_all_plugins.py .
          python3 scripts/sync_repo.py --check
          python3 scripts/package_plugin.py ci-scaffold-check --out "$tmp/dist"
          ls "$tmp/dist"

  smoke:
    name: Plugin smoke tests
    runs-on: ubuntu-latest
    needs: validate
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run every plugins/*/ci-smoke.sh
        run: |
          set -euo pipefail
          found=0
          for smoke in plugins/*/ci-smoke.sh; do
            [ -e "$smoke" ] || continue
            found=1
            echo "::group::$smoke"
            bash "$smoke"
            echo "::endgroup::"
          done
          [ "$found" -eq 1 ] || echo "No ci-smoke.sh files found - nothing to run."

  claude-plugin-validate:
    name: claude plugin validate (best effort)
    runs-on: ubuntu-latest
    needs: validate
    # Uses Anthropic's own CLI for the authoritative schema check. Non-blocking because
    # it depends on an external package this repo does not control. Remove
    # continue-on-error once it has been reliably green.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install -g @anthropic-ai/claude-code
      - run: claude plugin validate . --strict

  gate:
    name: CI passed
    runs-on: ubuntu-latest
    needs: [validate, smoke]
    if: always()
    steps:
      - name: Fail if a required job failed
        run: |
          [ "${{ needs.validate.result }}" = "success" ] && [ "${{ needs.smoke.result }}" = "success" ] \
            || { echo "A required job failed."; exit 1; }
